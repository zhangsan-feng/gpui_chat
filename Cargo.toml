

[workspace]
members = [
    "gui",


]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"


[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed" }
gpui_tokio = { git = "https://github.com/zed-industries/zed" }
reqwest_client = { git = "https://github.com/zed-industries/zed" }

#terminal = { git = "https://github.com/zed-industries/zed"}
#terminal_view = { git = "https://github.com/zed-industries/zed"}

gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }

tokio = { version = "1.49.0", features = ["full"] }
axum = {version = "0.8.8"}
tower-http = {version = "0.6.8", features = ["full"] }
fern = "0.7.1"
log = {version = "0.4.29"}

serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0.100"
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = {version = "0.13.1", features = ["default-tls", "gzip"]}
